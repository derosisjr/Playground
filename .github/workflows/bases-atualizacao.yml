name: Índice de atualização das bases

# Publica a data REAL da última mudança de cada base, lida do histórico do git.
# O hub usa isso no "atualizado há N dias": no GitHub Pages o cabeçalho
# Last-Modified é a hora do deploy, igual para todo arquivo, então bases paradas
# há meses apareciam como "atualizado hoje".
#
# Também gera novidades.json — o feed do que mudou nas bases desde a véspera
# (contrato em .claude/rules/site-frontend.md, "Novidades (feed)"). Este é o único
# workflow que escreve esse arquivo: ele lê os índices depois que os crons de base
# (04:00-08:30) já rodaram.
#
# Workflow próprio, e não um passo dentro dos 7 workflows de base, por dois motivos:
# (a) todos usam fetch-depth: 1 e `git log` enxergaria um commit só;
# (b) nenhum tem `concurrency:` nem faz pull antes do push — sete workflows
#     escrevendo o MESMO arquivo transformaria as colisões de segunda-feira
#     (legis 07:17, proposituras 07:37, despesas 07:41) em perda de dados.

on:
  schedule:
    - cron: "0 12 * * *"  # 12:00 UTC — fora do bloco 04:00-08:30 dos demais workflows
  workflow_dispatch:

permissions:
  contents: write

# UTF-8 como codificação padrão do Python (vira o padrão no 3.15, out/2026):
# os crawlers lidam com páginas em latin-1 e campos UTF-8 embutidos — sem isto,
# um `open()` sem `encoding=` dependeria do locale do runner.
env:
  PYTHONUTF8: "1"

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # OBRIGATÓRIO: sem histórico completo o git log não vê nada

      - name: Configurar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Só stdlib — sem requirements.txt de propósito, para o job ser rápido e
      # não quebrar por dependência externa.
      - name: Gerar índice de datas
        run: python .github/scripts/bases_atualizacao.py

      # Feed "o que mudou" (novidades.json): compara os índices de hoje com o retrato
      # guardado no próprio arquivo. Só stdlib, como o passo acima. Índice ausente ou
      # ilegível só pula a base (aviso no log); um erro do script não pode impedir a
      # publicação das datas — continue-on-error aqui e vermelho no último passo.
      - name: Gerar feed de novidades
        id: novidades
        continue-on-error: true
        run: python .github/scripts/novidades.py

      # novidades.json só entra se o gerador terminou: antes da 1ª gravação o arquivo
      # não existe, e um `git add` dele derrubaria também a publicação das datas.
      - name: Commitar (se mudou)
        uses: ./.github/actions/commitar
        with:
          caminhos: bases-atualizacao.json ${{ steps.novidades.outcome == 'success' && 'novidades.json' || '' }}
          mensagem: "chore: atualiza índice de datas e novidades das bases"
          sem-mudancas: "Sem mudancas nas datas nem nas novidades."

      # Guarda de FRESCOR — lê a data do dado DENTRO de cada índice e falha se
      # alguma base congelou. As guardas dos workflows de base medem volume
      # ("está mutilada?"); nenhuma media frescor ("está congelada?"), e foi por
      # esse vão que Despesas passou 40 dias parada com tudo verde (2026-08).
      #
      # Roda DEPOIS do commit de propósito: publicar as datas é a função
      # principal deste workflow e não pode ser bloqueada pelo alarme.
      - name: Guarda de frescor das bases
        run: python .github/scripts/frescor_bases.py

      # Guarda de CAMPOS PÚBLICOS — o JSON que está no ar só tem as chaves da lista
      # branca do export. Pega o arquivo antigo que fica publicado quando o export de
      # uma base não roda (o teste do export só vale para o arquivo que ele gera).
      - name: Guarda de campos públicos
        if: ${{ !cancelled() }}
        run: python .github/scripts/checar_publicos.py

      # O feed parado não pode ficar verde: o job termina vermelho DEPOIS de publicar
      # as datas (e o alerta-falhas abre a issue).
      - name: Falha no feed de novidades (visível)
        if: steps.novidades.outcome == 'failure'
        run: |
          echo "O gerador de novidades falhou — ver o passo 'Gerar feed de novidades'."
          exit 1
