name: Índice de atualização das bases

# Publica a data REAL da última mudança de cada base, lida do histórico do git.
# O hub usa isso no "atualizado há N dias": no GitHub Pages o cabeçalho
# Last-Modified é a hora do deploy, igual para todo arquivo, então bases paradas
# há meses apareciam como "atualizado hoje".
#
# Workflow próprio, e não um passo dentro dos 7 workflows de base, por dois motivos:
# (a) todos usam fetch-depth: 1 e `git log` enxergaria um commit só;
# (b) nenhum tem `concurrency:` nem faz pull antes do push — sete workflows
#     escrevendo o MESMO arquivo transformaria as colisões de segunda-feira
#     (legis 07:17, proposituras 07:37, despesas 07:41) em perda de dados.

on:
  schedule:
    - cron: "0 12 * * *"  # 12:00 UTC — fora do bloco 04:00-08:30 dos demais workflows
  workflow_dispatch:

permissions:
  contents: write

# UTF-8 como codificação padrão do Python (vira o padrão no 3.15, out/2026):
# os crawlers lidam com páginas em latin-1 e campos UTF-8 embutidos — sem isto,
# um `open()` sem `encoding=` dependeria do locale do runner.
env:
  PYTHONUTF8: "1"

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # OBRIGATÓRIO: sem histórico completo o git log não vê nada

      - name: Configurar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Só stdlib — sem requirements.txt de propósito, para o job ser rápido e
      # não quebrar por dependência externa.
      - name: Gerar índice de datas
        run: python .github/scripts/bases_atualizacao.py

      - name: Commitar (se mudou)
        uses: ./.github/actions/commitar
        with:
          caminhos: bases-atualizacao.json
          mensagem: "chore: atualiza índice de datas das bases"
          sem-mudancas: "Sem mudancas nas datas das bases."

      # Guarda de FRESCOR — lê a data do dado DENTRO de cada índice e falha se
      # alguma base congelou. As guardas dos workflows de base medem volume
      # ("está mutilada?"); nenhuma media frescor ("está congelada?"), e foi por
      # esse vão que Despesas passou 40 dias parada com tudo verde (2026-08).
      #
      # Roda DEPOIS do commit de propósito: publicar as datas é a função
      # principal deste workflow e não pode ser bloqueada pelo alarme.
      - name: Guarda de frescor das bases
        run: python .github/scripts/frescor_bases.py
