name: Preços — backfill do espelho

# Carga histórica das cidades-par. Roda SÓ sob demanda e é resumível: cada
# execução consome um orçamento de chamadas, commita o espelho e para limpo.
# Rodar N vezes completa a base — o controle_listagem e o itens_status garantem
# que nada é refeito.

on:
  workflow_dispatch:
    inputs:
      tier:
        description: "listagem (Tier 1) ou itens (Tier 2)"
        required: true
        default: "itens"
        type: choice
        options: [listagem, itens]
      cidade:
        description: "Código IBGE (vazio = todas as cidades-par)"
        required: false
        default: ""
      ano:
        description: "Exercício (vazio = 2025 até o corrente)"
        required: false
        default: ""
      orcamento:
        description: "Teto de chamadas de itens nesta execução"
        required: false
        default: "2500"

permissions:
  contents: write

# UTF-8 como codificação padrão do Python (vira o padrão no 3.15, out/2026):
# os crawlers lidam com páginas em latin-1 e campos UTF-8 embutidos — sem isto,
# um `open()` sem `encoding=` dependeria do locale do runner.
env:
  PYTHONUTF8: "1"

# Serializa com o irmão: precos.yml e precos-backfill.yml escrevem o MESMO
# precos/espelho — dois runners gravando os mesmos .gz a partir de bancos
# diferentes é perda de dados, não só um push rejeitado (invariante de
# rules/github-actions.md). cancel-in-progress: false = o segundo espera.
concurrency:
  group: precos-espelho
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Instalar uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.10"
          enable-cache: true
          cache-dependency-glob: "precos/requirements.txt"

      - name: Instalar dependencias
        run: uv pip install --system -r precos/requirements.txt

      - name: Restaurar base SQLite (cache)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: precos/precos.sqlite
          key: precos-db-${{ github.run_id }}
          restore-keys: |
            precos-db-

      - name: Reconstruir SQLite se o cache esfriou
        run: python precos/reconstruir.py --se-faltar

      # Inputs sempre via env, nunca ${{ }} dentro de run: — anti-injeção de shell
      - name: Coletar
        env:
          TIER: ${{ github.event.inputs.tier }}
          CIDADE: ${{ github.event.inputs.cidade }}
          ANO: ${{ github.event.inputs.ano }}
          ORCAMENTO: ${{ github.event.inputs.orcamento }}
        run: |
          ARGS=""
          [ -n "$CIDADE" ] && ARGS="$ARGS --cidade $CIDADE"
          [ -n "$ANO" ] && ARGS="$ARGS --ano $ANO"
          if [ "$TIER" = "listagem" ]; then
            python precos/crawler.py --listagem $ARGS
          else
            python precos/crawler.py --itens --orcamento "${ORCAMENTO:-2500}"
          fi

      - name: Commitar espelho
        run: |
          # Espelho íntegro? Um .gz truncado (coleta cortada no meio da gravação)
          # não pode ser publicado: é a fonte da verdade e o sqlite é derivado.
          python - <<'PY'
          import glob, gzip, sys
          ruins = []
          for p in sorted(glob.glob('precos/espelho/*.jsonl.gz')):
              try:
                  with gzip.open(p, 'rb') as f:
                      while f.read(1 << 20):
                          pass
              except (OSError, EOFError) as e:
                  ruins.append(f'{p}: {e}')
          if ruins:
              print('ABORTANDO: espelho corrompido:')
              for r in ruins:
                  print('  ' + r)
              sys.exit(1)
          print(f'espelho íntegro: {len(glob.glob("precos/espelho/*.jsonl.gz"))} arquivos')
          PY
          MB=$(du -sm precos/espelho 2>/dev/null | cut -f1)
          echo "espelho: ${MB:-0} MB"
          if [ "${MB:-0}" -gt 20 ]; then
            echo "ABORTANDO: espelho passou do teto de 20 MB — revise o escopo."
            exit 1
          fi

      - name: Commitar e publicar
        uses: ./.github/actions/commitar
        with:
          caminhos: precos/espelho
          mensagem: "chore(precos): backfill do espelho"
          sem-mudancas: "Sem mudancas no espelho."
