name: Respostas do Executivo

on:
  schedule:
    - cron: "0 9 * * 1-5"  # 09h UTC = 06h BRT, dias úteis
  workflow_dispatch:
    inputs:
      ano:
        description: "Ano da busca (vazio = ano corrente)"
        required: false
        default: ""

jobs:
  arquivar-respostas:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: respostas-executivo/requirements.txt

      - name: Instalar dependencias
        run: pip install -r respostas-executivo/requirements.txt

      - name: Arquivar respostas no Drive e atualizar planilha
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: |
          ANO_ARG=""
          if [ -n "${{ github.event.inputs.ano }}" ]; then
            ANO_ARG="--ano ${{ github.event.inputs.ano }}"
          fi
          python respostas-executivo/index.py $ANO_ARG
