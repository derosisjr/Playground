name: Respostas do Executivo

on:
  schedule:
    - cron: "31 8 * * 1-5"  # 08:31 UTC = 05:31 BRT, dias úteis (minuto quebrado p/ evitar pico)
  workflow_dispatch:
    inputs:
      ano:
        description: "Ano da busca (vazio = ano corrente)"
        required: false
        default: ""
      forcar:
        description: "Reprocessar tudo (true) — útil p/ testar o e-mail"
        required: false
        default: "false"
      limite:
        description: "Máx. de itens a processar (vazio = todos)"
        required: false
        default: ""
      cods:
        description: "Reprocessar só estes cods (lista por vírgula) — p/ reenviar e-mail perdido"
        required: false
        default: ""
      email:
        description: "Enviar e-mail resumo (false p/ backfill silencioso)"
        required: false
        default: "true"

permissions:
  contents: write

# UTF-8 como codificação padrão do Python (vira o padrão no 3.15, out/2026):
# os crawlers lidam com páginas em latin-1 e campos UTF-8 embutidos — sem isto,
# um `open()` sem `encoding=` dependeria do locale do runner.
env:
  PYTHONUTF8: "1"

jobs:
  arquivar-respostas:
    runs-on: ubuntu-latest
    # 35 min: além de varrer ~900 páginas, a rotina agora rebaixa os PDFs dos itens
    # sem veredito de mérito para classificá-los (ver classificar.py).
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Instalar uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.10"
          enable-cache: true
          cache-dependency-glob: "respostas-executivo/requirements.txt"

      - name: Instalar dependencias
        run: uv pip install --system -r respostas-executivo/requirements.txt

      # 253 linhas de fixtures reais do classificador (mérito × prorrogação ×
      # encaminhamento) que nunca rodavam no CI. Falhou, não crawla nem publica.
      - name: Testes do classificador
        run: python -m unittest discover -s respostas-executivo -p "testes_*.py"

      - name: Arquivar respostas no Drive e atualizar planilha
        env:
          GOOGLE_OAUTH_TOKEN: ${{ secrets.GOOGLE_OAUTH_TOKEN }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RESPOSTAS_EMAIL_TO: ${{ secrets.RESPOSTAS_EMAIL_TO }}
          # inputs sempre via env (nunca ${{ }} dentro de run:) — evita injeção de shell
          ANO_INPUT: ${{ github.event.inputs.ano }}
          FORCAR_INPUT: ${{ github.event.inputs.forcar }}
          LIMITE_INPUT: ${{ github.event.inputs.limite }}
          CODS_INPUT: ${{ github.event.inputs.cods }}
          EMAIL_INPUT: ${{ github.event.inputs.email }}
        run: |
          ANO_ARG=""
          if [ -n "$ANO_INPUT" ]; then
            ANO_ARG="--ano $ANO_INPUT"
          fi
          FORCAR_ARG=""
          if [ "$FORCAR_INPUT" = "true" ]; then
            FORCAR_ARG="--forcar"
          fi
          LIMITE_ARG=""
          if [ -n "$LIMITE_INPUT" ]; then
            LIMITE_ARG="--limite $LIMITE_INPUT"
          fi
          CODS_ARG=""
          if [ -n "$CODS_INPUT" ]; then
            CODS_ARG="--cods $CODS_INPUT"
          fi
          # E-mail ligado por padrão (inclusive no agendamento); só desliga quando
          # o disparo manual passa email=false (ex.: backfill silencioso).
          EMAIL_ARG="--email"
          if [ "$EMAIL_INPUT" = "false" ]; then
            EMAIL_ARG=""
          fi
          python respostas-executivo/index.py $ANO_ARG $FORCAR_ARG $LIMITE_ARG $CODS_ARG $EMAIL_ARG

      # Exporta a aba "requerimentos" da planilha para o JSON do painel estático e
      # commita no repo (Pages serve o requerimentos-index.json da raiz).
      - name: Exportar e commitar requerimentos-index.json
        env:
          GOOGLE_OAUTH_TOKEN: ${{ secrets.GOOGLE_OAUTH_TOKEN }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: |
          python respostas-executivo/export.py
          # Guarda anti-truncamento: se vier vazio (falha de auth/leitura), não commita.
          N=$(python -c "import json;print(len(json.load(open('requerimentos-index.json',encoding='utf-8'))))")
          echo "requerimentos-index.json com $N item(ns)."
          if [ "$N" -eq 0 ]; then
            echo "ABORTANDO commit: base vazia, provável falha de leitura da planilha."
            exit 1  # falha visível: com exit 0 a base de Proposituras ficou 2 meses parada sem ninguém notar
          fi

      - name: Commitar e publicar
        uses: ./.github/actions/commitar
        with:
          caminhos: requerimentos-index.json
          mensagem: "chore: atualiza base de Requerimentos"
          sem-mudancas: "Sem mudancas na base de requerimentos."
