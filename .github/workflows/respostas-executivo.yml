name: Respostas do Executivo

on:
  schedule:
    - cron: "31 8 * * 1-5"  # 08:31 UTC = 05:31 BRT, dias úteis (minuto quebrado p/ evitar pico)
  workflow_dispatch:
    inputs:
      ano:
        description: "Ano da busca (vazio = ano corrente)"
        required: false
        default: ""
      forcar:
        description: "Reprocessar tudo (true) — útil p/ testar o e-mail"
        required: false
        default: "false"
      limite:
        description: "Máx. de itens a processar (vazio = todos)"
        required: false
        default: ""
      email:
        description: "Enviar e-mail resumo (false p/ backfill silencioso)"
        required: false
        default: "true"

permissions:
  contents: write

jobs:
  arquivar-respostas:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: respostas-executivo/requirements.txt

      - name: Instalar dependencias
        run: pip install -r respostas-executivo/requirements.txt

      - name: Arquivar respostas no Drive e atualizar planilha
        env:
          GOOGLE_OAUTH_TOKEN: ${{ secrets.GOOGLE_OAUTH_TOKEN }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RESPOSTAS_EMAIL_TO: ${{ secrets.RESPOSTAS_EMAIL_TO }}
        run: |
          ANO_ARG=""
          if [ -n "${{ github.event.inputs.ano }}" ]; then
            ANO_ARG="--ano ${{ github.event.inputs.ano }}"
          fi
          FORCAR_ARG=""
          if [ "${{ github.event.inputs.forcar }}" = "true" ]; then
            FORCAR_ARG="--forcar"
          fi
          LIMITE_ARG=""
          if [ -n "${{ github.event.inputs.limite }}" ]; then
            LIMITE_ARG="--limite ${{ github.event.inputs.limite }}"
          fi
          # E-mail ligado por padrão (inclusive no agendamento); só desliga quando
          # o disparo manual passa email=false (ex.: backfill silencioso).
          EMAIL_ARG="--email"
          if [ "${{ github.event.inputs.email }}" = "false" ]; then
            EMAIL_ARG=""
          fi
          python respostas-executivo/index.py $ANO_ARG $FORCAR_ARG $LIMITE_ARG $EMAIL_ARG

      # Exporta a aba "requerimentos" da planilha para o JSON do painel estático e
      # commita no repo (Pages serve o requerimentos-index.json da raiz).
      - name: Exportar e commitar requerimentos-index.json
        env:
          GOOGLE_OAUTH_TOKEN: ${{ secrets.GOOGLE_OAUTH_TOKEN }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: |
          python respostas-executivo/export.py
          # Guarda anti-truncamento: se vier vazio (falha de auth/leitura), não commita.
          N=$(python -c "import json;print(len(json.load(open('requerimentos-index.json',encoding='utf-8'))))")
          echo "requerimentos-index.json com $N item(ns)."
          if [ "$N" -eq 0 ]; then
            echo "ABORTANDO commit: base vazia, provável falha de leitura da planilha."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add requerimentos-index.json
          if git diff --quiet --cached; then
            echo "Sem mudancas na base de requerimentos."
          else
            git commit -m "chore: atualiza base de Requerimentos ($(date +%F))"
            git push
          fi
