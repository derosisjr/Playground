name: Briefing Ordem do Dia

on:
  schedule:
    - cron: "0 22 * * 1,3"
  workflow_dispatch:
    inputs:
      sessao_id:
        description: "ID da sessao (vazio = mais recente)"
        required: false
        default: ""

# só lê o repo e sobe artifact — não commita
permissions:
  contents: read

# UTF-8 como codificação padrão do Python (vira o padrão no 3.15, out/2026):
# os crawlers lidam com páginas em latin-1 e campos UTF-8 embutidos — sem isto,
# um `open()` sem `encoding=` dependeria do locale do runner.
env:
  PYTHONUTF8: "1"

jobs:
  gerar-briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # este workflow não faz push

      - name: Configurar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Instalar uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.10"
          enable-cache: true
          cache-dependency-glob: "ordem-do-dia/requirements.txt"

      - name: Instalar dependencias
        run: uv pip install --system -r ordem-do-dia/requirements.txt

      - name: Gerar briefing e enviar por e-mail
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_TO: ${{ secrets.GMAIL_TO }}
          # input sempre via env (nunca ${{ }} dentro de run:) — evita injeção de shell
          SESSAO_ID: ${{ github.event.inputs.sessao_id }}
        run: |
          SESSAO_ARG=""
          if [ -n "$SESSAO_ID" ]; then
            SESSAO_ARG="--sessao $SESSAO_ID"
          fi
          python ordem-do-dia/index.py $SESSAO_ARG --email --output ordem-do-dia/ultimo-briefing.md

      - name: Salvar briefing como artefato
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: briefing-${{ github.run_id }}
          path: ordem-do-dia/ultimo-briefing.md
          retention-days: 30
