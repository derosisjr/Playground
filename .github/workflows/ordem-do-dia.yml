name: Briefing Ordem do Dia

on:
  schedule:
    - cron: "0 22 * * 1,3"
  workflow_dispatch:
    inputs:
      sessao_id:
        description: "ID da sessao (vazio = mais recente)"
        required: false
        default: ""

jobs:
  gerar-briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: ordem-do-dia/requirements.txt

      - name: Instalar dependencias
        run: pip install -r ordem-do-dia/requirements.txt

      - name: Gerar briefing e enviar por e-mail
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_TO: ${{ secrets.GMAIL_TO }}
        run: |
          SESSAO_ARG=""
          if [ -n "${{ github.event.inputs.sessao_id }}" ]; then
            SESSAO_ARG="--sessao ${{ github.event.inputs.sessao_id }}"
          fi
          python ordem-do-dia/index.py $SESSAO_ARG --email --output ordem-do-dia/ultimo-briefing.md

      - name: Salvar briefing como artefato
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: briefing-${{ github.run_id }}
          path: ordem-do-dia/ultimo-briefing.md
          retention-days: 30
