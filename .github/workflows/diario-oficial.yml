name: Diário Oficial — captura diária de atos

on:
  schedule:
    # 03:17 UTC = 00:17 BRT — logo após a meia-noite (o DOM sai no fim da noite
    # anterior, então a edição do dia já está disponível). Minuto "quebrado" e fora
    # do topo da hora de propósito: cron em HH:00 é quando o GitHub Actions mais
    # atrasa por congestionamento. Seg–sex (1-5): o DOM não publica sáb/dom; o
    # --dias 3 da segunda cobre qualquer atraso do fim de semana.
    - cron: "17 3 * * 1-5"
  workflow_dispatch:
    inputs:
      data:
        description: "Edição específica (AAAA-MM-DD). Vazio = últimos dias. (envia e-mail)"
        required: false
        default: ""
      desde:
        description: "Carga retroativa a partir de (AAAA-MM-DD). Prioridade sobre 'data'. (NÃO envia e-mail)"
        required: false
        default: ""
      email_teste:
        description: "E-mail de teste: envia o briefing SÓ p/ este endereço (não aos assessores)"
        required: false
        default: ""
      forcar:
        description: "Reprocessa a edição mesmo já registrada (--forcar). Use p/ recapturar com regras novas."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  capturar:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: diario-oficial/requirements.txt

      - name: Instalar dependencias
        run: pip install -r diario-oficial/requirements.txt

      # O .sqlite (controle de edições/atos já vistos) NÃO é versionado — persiste
      # entre execuções via cache do Actions, garantindo a dedup na planilha.
      - name: Restaurar base SQLite (cache)
        uses: actions/cache@v5
        with:
          path: diario-oficial/diario.sqlite
          key: diario-db-${{ github.run_id }}
          restore-keys: |
            diario-db-

      - name: Capturar atos, escrever no Sheets e avisar assessores
        env:
          GOOGLE_OAUTH_TOKEN: ${{ secrets.GOOGLE_OAUTH_TOKEN }}
          DOM_SHEET_ID: ${{ secrets.DOM_SHEET_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DOM_BRIEFING_TO: ${{ secrets.DOM_BRIEFING_TO }}
          DESPESAS_BRIEFING_TO: ${{ secrets.DESPESAS_BRIEFING_TO }}
          RESPOSTAS_EMAIL_TO: ${{ secrets.RESPOSTAS_EMAIL_TO }}
          GMAIL_TO: ${{ secrets.GMAIL_TO }}
        run: |
          # e-mail de teste sobrepõe os destinatários só nesta execução
          TESTE="${{ github.event.inputs.email_teste }}"
          [ -n "$TESTE" ] && export DOM_BRIEFING_TO="$TESTE"
          # --forcar reprocessa edição já registrada (recaptura com regras novas)
          FORCAR=""
          [ -n "${{ github.event.inputs.forcar }}" ] && FORCAR="--forcar"
          if [ -n "${{ github.event.inputs.desde }}" ]; then
            python diario-oficial/monitor.py --desde "${{ github.event.inputs.desde }}" $FORCAR
          elif [ -n "${{ github.event.inputs.data }}" ]; then
            python diario-oficial/monitor.py --data "${{ github.event.inputs.data }}" --email $FORCAR
          else
            python diario-oficial/monitor.py --dias 3 --email
          fi
