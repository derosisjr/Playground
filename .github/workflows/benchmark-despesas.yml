name: Despesas — benchmark cidades pares (SICONFI)

# A DCA é anual (publicada ~abril do ano seguinte). O cron mensal só recomita
# quando o Tesouro publicar/retificar dados — na maioria dos meses é no-op.
on:
  schedule:
    - cron: "13 8 6 * *"  # dia 6 de cada mês, 08:13 UTC
  workflow_dispatch:
    inputs:
      ano:
        description: "Exercício da DCA (vazio = mais recente disponível)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: despesas/requirements.txt

      - name: Instalar dependencias
        run: pip install -r despesas/requirements.txt

      - name: Coletar DCA das cidades
        env:
          ANO_INPUT: ${{ github.event.inputs.ano }}
        run: |
          if [ -n "$ANO_INPUT" ]; then
            python despesas/benchmark.py --ano "$ANO_INPUT"
          else
            python despesas/benchmark.py
          fi

      - name: Commitar (se mudou)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add despesas/benchmark.json
          if git diff --quiet --cached; then
            echo "Benchmark sem mudancas."
          else
            git commit -m "chore: atualiza benchmark de despesas por funcao (SICONFI)"
            git push
          fi
