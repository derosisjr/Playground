name: Despesas — benchmark cidades pares (SICONFI)

# A DCA é anual (publicada ~abril do ano seguinte). O cron mensal só recomita
# quando o Tesouro publicar/retificar dados — na maioria dos meses é no-op.
on:
  schedule:
    - cron: "13 8 6 * *"  # dia 6 de cada mês, 08:13 UTC
  workflow_dispatch:
    inputs:
      ano:
        description: "Exercício da DCA (vazio = mais recente disponível)"
        required: false
        default: ""

permissions:
  contents: write

# UTF-8 como codificação padrão do Python (vira o padrão no 3.15, out/2026):
# os crawlers lidam com páginas em latin-1 e campos UTF-8 embutidos — sem isto,
# um `open()` sem `encoding=` dependeria do locale do runner.
env:
  PYTHONUTF8: "1"

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Instalar uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.10"
          enable-cache: true
          cache-dependency-glob: "despesas/requirements.txt"

      - name: Instalar dependencias
        run: uv pip install --system -r despesas/requirements.txt

      - name: Coletar DCA das cidades
        env:
          ANO_INPUT: ${{ github.event.inputs.ano }}
        run: |
          if [ -n "$ANO_INPUT" ]; then
            python despesas/benchmark.py --ano "$ANO_INPUT"
          else
            python despesas/benchmark.py
          fi

      - name: Commitar (se mudou)
        uses: ./.github/actions/commitar
        with:
          caminhos: despesas/benchmark.json
          mensagem: "chore: atualiza benchmark de despesas por funcao (SICONFI)"
          sem-mudancas: "Benchmark sem mudancas."
          com-data: "false"
