name: zizmor — auditoria dos workflows

# Auditoria estática dos workflows (ações sem SHA, cache envenenável, injeção de
# template, typosquat de ação). Roda em ~10 s. Falha o job quando encontra algo
# acima da confiança mínima — o que inclui qualquer `uses:` que volte a apontar
# para uma tag móvel em vez do SHA. Configuração em .github/zizmor.yml.

on:
  pull_request:
    paths: [".github/**"]
  push:
    branches: [master]
    paths: [".github/**"]
  schedule:
    - cron: "0 13 * * 1"  # segunda 13:00 UTC: auditorias novas do zizmor mesmo sem mudança aqui
  workflow_dispatch:

permissions: {}

jobs:
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # este workflow não faz push

      - name: zizmor
        uses: zizmorcore/zizmor-action@70fb788f84895a7701f5643d103d587e460b5c99 # v0.6.3
        with:
          version: "1.30.0"
          advanced-security: false  # resultado no log do job, sem depender do Code Scanning
          min-confidence: medium
