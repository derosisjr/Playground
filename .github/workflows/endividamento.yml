name: Endividamento — atualização mensal

on:
  schedule:
    - cron: "41 4 5 * *"  # dia 5 de cada mês, 04:41 UTC (RGF é quadrimestral)
  workflow_dispatch:
    inputs:
      forcar:
        description: "Rebaixar todos os quadrimestres (ignora controle_carga)?"
        required: false
        default: "false"

permissions:
  contents: write

# UTF-8 como codificação padrão do Python (vira o padrão no 3.15, out/2026):
# os crawlers lidam com páginas em latin-1 e campos UTF-8 embutidos — sem isto,
# um `open()` sem `encoding=` dependeria do locale do runner.
env:
  PYTHONUTF8: "1"

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Instalar uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.10"
          enable-cache: true
          cache-dependency-glob: "endividamento/requirements.txt"

      - name: Instalar dependencias
        run: uv pip install --system -r endividamento/requirements.txt

      # O .sqlite NÃO é versionado — persiste entre execuções via cache do Actions.
      # Se o cache esfriar não tem problema: a carga completa leva ~2 min.
      - name: Restaurar base SQLite (cache)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: endividamento/endividamento.sqlite
          key: endividamento-db-${{ github.run_id }}
          restore-keys: |
            endividamento-db-

      - name: Crawl + export
        env:
          FORCAR: ${{ github.event.inputs.forcar }}
        run: |
          if [ "$FORCAR" = "true" ]; then
            python endividamento/crawler.py --forcar
          else
            python endividamento/crawler.py
          fi
          python endividamento/export.py

      # Guarda anti-truncamento: o export já aborta com RCL implausível ou
      # semáforo incompleto; aqui checa a série antes de publicar.
      - name: Commitar index (se houver e for íntegro)
        run: |
          OK=$(python -c "
          import json
          d = json.load(open('endividamento-index.json', encoding='utf-8'))
          print(int(len(d.get('serie', [])) >= 10
                    and len(d.get('semaforo', [])) == 3
                    and (d['totais'].get('rcl') or 0) > 1e9))")
          if [ "$OK" != "1" ]; then
            echo "ABORTANDO commit: índice incompleto (fonte externa fora do ar?)."
            exit 1  # falha visível: com exit 0 a base de Proposituras ficou 2 meses parada sem ninguém notar
          fi

      - name: Commitar e publicar
        uses: ./.github/actions/commitar
        with:
          caminhos: endividamento-index.json
          mensagem: "chore: atualiza Painel de Endividamento"
          sem-mudancas: "Sem mudancas no endividamento."
