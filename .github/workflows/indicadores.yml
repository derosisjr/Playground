name: Indicadores — atualização mensal

on:
  schedule:
    - cron: "23 4 3 * *"  # dia 3 de cada mês, 04:23 UTC (dados externos mudam devagar)
  workflow_dispatch:
    inputs:
      forcar:
        description: "Rebaixar todos os anos (ignora controle_carga)?"
        required: false
        default: "false"

permissions:
  contents: write

# UTF-8 como codificação padrão do Python (vira o padrão no 3.15, out/2026):
# os crawlers lidam com páginas em latin-1 e campos UTF-8 embutidos — sem isto,
# um `open()` sem `encoding=` dependeria do locale do runner.
env:
  PYTHONUTF8: "1"

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Instalar uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.10"
          enable-cache: true
          cache-dependency-glob: "indicadores/requirements.txt"

      - name: Instalar dependencias
        run: uv pip install --system -r indicadores/requirements.txt

      # O .sqlite NÃO é versionado — persiste entre execuções via cache do Actions.
      # Se o cache esfriar não tem problema: a carga completa leva ~1 min.
      - name: Restaurar base SQLite (cache)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: indicadores/indicadores.sqlite
          key: indicadores-db-${{ github.run_id }}
          restore-keys: |
            indicadores-db-

      - name: Crawl + export
        env:
          FORCAR: ${{ github.event.inputs.forcar }}
        run: |
          if [ "$FORCAR" = "true" ]; then
            python indicadores/crawler.py --forcar
          else
            python indicadores/crawler.py
          fi
          python indicadores/export.py

      # Guarda anti-truncamento: se as fontes externas falharem e o índice
      # vier sem indicadores, aborta o commit p/ não publicar painel vazio.
      - name: Commitar index (se houver e for íntegro)
        run: |
          OK=$(python -c "
          import json
          d = json.load(open('indicadores-index.json', encoding='utf-8'))
          t = d['temas']
          print(int(bool(t.get('saude', {}).get('indicadores'))
                    and bool(t.get('educacao', {}).get('indicadores'))
                    and bool(t.get('fiscal', {}).get('indicadores'))
                    and len(t['saude'].get('gasto_per_capita', [])) >= 3))")
          if [ "$OK" != "1" ]; then
            echo "ABORTANDO commit: índice incompleto (fonte externa fora do ar?)."
            exit 1  # falha visível: com exit 0 a base de Proposituras ficou 2 meses parada sem ninguém notar
          fi

      - name: Commitar e publicar
        uses: ./.github/actions/commitar
        with:
          caminhos: indicadores-index.json
          mensagem: "chore: atualiza base de Indicadores"
          sem-mudancas: "Sem mudancas nos indicadores."
