name: Proposituras — atualização incremental

on:
  schedule:
    # 2x/semana de propósito: o GitHub apaga cache sem acesso há 7 dias e o .sqlite
    # (68 MB, não versionado) vive só nele. Com cron semanal o intervalo batia
    # exatamente na janela de despejo — qualquer atraso na fila do Actions
    # derrubava a base. Em jun/2026 foi o que aconteceu: o banco voltou a zero,
    # passou a conter só o ano corrente e a guarda barrou o commit por 2 meses.
    - cron: "37 7 * * 1"  # segunda-feira 07:37 UTC = 04:37 BRT
    - cron: "37 7 * * 4"  # quinta-feira, só para manter o cache vivo
  workflow_dispatch:
    inputs:
      ano:
        description: "Ano a varrer (vazio = ano corrente)"
        required: false
        default: ""
      forcar:
        description: "Reprocessar proposituras já no banco (vazio = sim, p/ atualizar tramitação)"
        required: false
        default: "true"

permissions:
  contents: write

# UTF-8 como codificação padrão do Python (vira o padrão no 3.15, out/2026):
# os crawlers lidam com páginas em latin-1 e campos UTF-8 embutidos — sem isto,
# um `open()` sem `encoding=` dependeria do locale do runner.
env:
  PYTHONUTF8: "1"

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 120  # a carga completa de recuperação (6.9k itens + tramitação) leva ~1h

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Instalar uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.10"
          enable-cache: true
          cache-dependency-glob: "proposituras/requirements.txt"

      - name: Instalar dependencias
        run: uv pip install --system -r proposituras/requirements.txt

      # O .sqlite (68M) NÃO é versionado — persiste entre execuções via cache do
      # Actions (chave rotativa por run + restore-keys p/ recuperar o mais recente).
      - name: Restaurar base SQLite (cache)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: proposituras/proposituras.sqlite
          key: proposituras-db-${{ github.run_id }}
          restore-keys: |
            proposituras-db-

      # Autocura: sem isto, perder o cache era irreversível. Diferente de despesas,
      # endividamento e indicadores — cujo workflow chama o crawler SEM --ano e por
      # isso refaz o histórico sozinho — aqui o crawl é limitado ao ano corrente, então
      # um banco vazio nunca voltava a encher e a guarda barrava o commit para sempre.
      - name: Recarregar histórico se o banco estiver parcial
        run: |
          N=$(python - <<'PY'
          import pathlib, sqlite3
          p = pathlib.Path("proposituras/proposituras.sqlite")
          if not p.exists():
              print(0)
          else:
              try:
                  con = sqlite3.connect(p)
                  print(con.execute("select count(*) from proposituras").fetchone()[0])
              except sqlite3.Error:
                  print(0)
          PY
          )
          echo "Banco restaurado do cache: $N proposituras."
          if [ "$N" -lt 6000 ]; then
            echo "Banco parcial — carga completa (todos os anos). Leva ~1h."
            python proposituras/crawler.py
          fi

      - name: Crawl incremental + export
        env:
          # inputs sempre via env (nunca ${{ }} dentro de run:) — evita injeção de shell
          ANO_INPUT: ${{ github.event.inputs.ano }}
          FORCAR_INPUT: ${{ github.event.inputs.forcar }}
        run: |
          ANO="$ANO_INPUT"
          [ -z "$ANO" ] && ANO="$(date +%Y)"
          # Padrão: --forcar (re-coleta o ano corrente p/ manter situação/tramitação atualizadas)
          FORCAR="--forcar"
          [ "$FORCAR_INPUT" = "false" ] && FORCAR=""
          python proposituras/crawler.py --ano "$ANO" $FORCAR
          python proposituras/export.py

      # Guarda anti-truncamento: se o cache foi perdido, a base teria só o ano
      # corrente e o index.json sairia mutilado. Só comita se houver volume coerente.
      - name: Commitar index (se houver e for íntegro)
        run: |
          N=$(python -c "import json;print(len(json.load(open('proposituras-index.json',encoding='utf-8'))))")
          echo "index.json com $N proposituras."
          if [ "$N" -lt 6000 ]; then
            echo "ABORTANDO commit: base parcial ($N < 6000) mesmo após a recarga."
            exit 1
          fi

      - name: Commitar e publicar
        uses: ./.github/actions/commitar
        with:
          caminhos: proposituras-index.json
          mensagem: "chore: atualiza base de Proposituras"
          sem-mudancas: "Sem mudancas na base."
