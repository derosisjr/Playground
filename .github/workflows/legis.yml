name: Legis — atualização incremental

on:
  schedule:
    - cron: "17 7 * * 1"  # segunda-feira 07:17 UTC = 04:17 BRT
  workflow_dispatch:
    inputs:
      ano:
        description: "Ano a varrer (vazio = ano corrente)"
        required: false
        default: ""
      forcar:
        description: "Reprocessar normas já no banco (true)"
        required: false
        default: "false"

permissions:
  contents: write

# UTF-8 como codificação padrão do Python (vira o padrão no 3.15, out/2026):
# os crawlers lidam com páginas em latin-1 e campos UTF-8 embutidos — sem isto,
# um `open()` sem `encoding=` dependeria do locale do runner.
env:
  PYTHONUTF8: "1"

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Instalar uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.10"
          enable-cache: true
          cache-dependency-glob: "legis/requirements.txt"

      - name: Instalar dependencias
        run: uv pip install --system -r legis/requirements.txt

      - name: Crawl incremental + export
        env:
          # inputs sempre via env (nunca ${{ }} dentro de run:) — evita injeção de shell
          ANO_INPUT: ${{ github.event.inputs.ano }}
          FORCAR_INPUT: ${{ github.event.inputs.forcar }}
        run: |
          ANO="$ANO_INPUT"
          [ -z "$ANO" ] && ANO="$(date +%Y)"
          FORCAR=""
          [ "$FORCAR_INPUT" = "true" ] && FORCAR="--forcar"
          python legis/crawler.py --ano "$ANO" $FORCAR
          python legis/export.py

      # Guarda anti-truncamento (padrão de proposituras.yml). Era o único
      # workflow de base sem guarda: fonte fora do ar → crawler saía 0 → export
      # reexportava o sqlite inalterado → "Sem mudancas" verde para sempre.
      # O crawler agora sai 1 se toda chamada falhar; o volume é barrado aqui.
      - name: Guarda de integridade do índice
        run: |
          N=$(python -c "import json;print(len(json.load(open('legis-index.json',encoding='utf-8'))))")
          echo "legis-index.json com $N normas."
          if [ "$N" -lt 3000 ]; then
            echo "ABORTANDO commit: índice parcial ($N < 3000)."
            exit 1
          fi

      - name: Commitar atualizacoes (se houver)
        uses: ./.github/actions/commitar
        with:
          caminhos: legis/legis.sqlite legis-index.json
          mensagem: "chore: atualiza base Legis"
          sem-mudancas: "Sem mudancas na base."
