name: Legis — atualização incremental

on:
  schedule:
    - cron: "17 7 * * 1"  # segunda-feira 07:17 UTC = 04:17 BRT
  workflow_dispatch:
    inputs:
      ano:
        description: "Ano a varrer (vazio = ano corrente)"
        required: false
        default: ""
      forcar:
        description: "Reprocessar normas já no banco (true)"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: legis/requirements.txt

      - name: Instalar dependencias
        run: pip install -r legis/requirements.txt

      - name: Crawl incremental + export
        env:
          # inputs sempre via env (nunca ${{ }} dentro de run:) — evita injeção de shell
          ANO_INPUT: ${{ github.event.inputs.ano }}
          FORCAR_INPUT: ${{ github.event.inputs.forcar }}
        run: |
          ANO="$ANO_INPUT"
          [ -z "$ANO" ] && ANO="$(date +%Y)"
          FORCAR=""
          [ "$FORCAR_INPUT" = "true" ] && FORCAR="--forcar"
          python legis/crawler.py --ano "$ANO" $FORCAR
          python legis/export.py

      - name: Commitar atualizacoes (se houver)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add legis/legis.sqlite legis-index.json
          if git diff --quiet --cached; then
            echo "Sem mudancas na base."
          else
            git commit -m "chore: atualiza base Legis ($(date +%F))"
            git push
          fi
