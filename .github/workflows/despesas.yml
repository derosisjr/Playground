name: Despesas — atualização incremental

on:
  schedule:
    - cron: "41 7 * * *"  # diariamente 07:41 UTC = 04:41 BRT
  workflow_dispatch:
    inputs:
      ano:
        description: "Ano a varrer (vazio = ano corrente)"
        required: false
        default: ""
      forcar_briefing:
        description: "Enviar o briefing semanal agora (mesmo fora de segunda)?"
        required: false
        default: "false"
      email_teste:
        description: "E-mail de teste: envia o briefing SÓ p/ este endereço (não aos assessores)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: despesas/requirements.txt

      - name: Instalar dependencias
        run: pip install -r despesas/requirements.txt

      # O .sqlite NÃO é versionado — persiste entre execuções via cache do Actions
      # (chave rotativa por run + restore-keys p/ recuperar o mais recente).
      - name: Restaurar base SQLite (cache)
        uses: actions/cache@v5
        with:
          path: despesas/despesas.sqlite
          key: despesas-db-${{ github.run_id }}
          restore-keys: |
            despesas-db-

      # Etapa 1: garante o mandato inteiro na base — se o cache estiver frio,
      # baixa os meses faltantes (2025→corrente). Se quente, não faz nada.
      # Etapa 2: re-baixa o ano corrente (--forcar) p/ pegar pagamentos novos.
      - name: Crawl incremental + export
        run: |
          ANO="${{ github.event.inputs.ano }}"
          [ -z "$ANO" ] && ANO="$(date +%Y)"
          python despesas/crawler.py                 # preenche meses faltantes do mandato
          python despesas/crawler.py --ano "$ANO" --forcar
          python despesas/export.py

      # Guarda anti-truncamento: o mandato completo é ~R$8 bi. Se a base vier
      # parcial (ex.: só o ano corrente, ~R$2-3 bi), aborta o commit p/ não
      # publicar uma base mutilada.
      - name: Commitar index (se houver e for íntegro)
        run: |
          TOTAL=$(python -c "import json;print(int(json.load(open('despesas-index.json',encoding='utf-8'))['totais']['geral']))")
          echo "index.json com total geral R$ $TOTAL."
          if [ "$TOTAL" -lt 4000000000 ]; then
            echo "ABORTANDO commit: base parcial (total $TOTAL < 4 bi), provável cache miss do .sqlite."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add despesas-index.json despesas/dados
          if git diff --quiet --cached; then
            echo "Sem mudancas na base."
          else
            git commit -m "chore: atualiza base de Despesas ($(date +%F))"
            git push
          fi

      # Briefing semanal por e-mail aos assessores: roda na SEGUNDA (após o
      # crawl+export, com a base do mesmo run) ou quando forçado manualmente.
      - name: Briefing semanal (segunda-feira)
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DESPESAS_BRIEFING_TO: ${{ secrets.DESPESAS_BRIEFING_TO }}
          RESPOSTAS_EMAIL_TO: ${{ secrets.RESPOSTAS_EMAIL_TO }}
          GMAIL_TO: ${{ secrets.GMAIL_TO }}
        run: |
          TESTE="${{ github.event.inputs.email_teste }}"
          # e-mail de teste sobrepõe os destinatários só nesta execução
          [ -n "$TESTE" ] && export DESPESAS_BRIEFING_TO="$TESTE"
          if [ -n "$TESTE" ] || [ "$(date +%u)" = "1" ] || [ "${{ github.event.inputs.forcar_briefing }}" = "true" ]; then
            python despesas/briefing.py
          else
            echo "Fora de segunda e sem --forcar_briefing: briefing nao enviado."
          fi
