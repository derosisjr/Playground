name: Despesas — atualização incremental

on:
  schedule:
    - cron: "41 7 * * *"  # diariamente 07:41 UTC = 04:41 BRT
  workflow_dispatch:
    inputs:
      ano:
        description: "Ano a varrer (vazio = ano corrente)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: despesas/requirements.txt

      - name: Instalar dependencias
        run: pip install -r despesas/requirements.txt

      # O .sqlite NÃO é versionado — persiste entre execuções via cache do Actions
      # (chave rotativa por run + restore-keys p/ recuperar o mais recente).
      - name: Restaurar base SQLite (cache)
        uses: actions/cache@v4
        with:
          path: despesas/despesas.sqlite
          key: despesas-db-${{ github.run_id }}
          restore-keys: |
            despesas-db-

      # Re-baixa os meses do ano corrente (--forcar) p/ pegar pagamentos novos do mês
      # em andamento; meses fechados de anos anteriores ficam no cache.
      - name: Crawl incremental + export
        run: |
          ANO="${{ github.event.inputs.ano }}"
          [ -z "$ANO" ] && ANO="$(date +%Y)"
          python despesas/crawler.py --ano "$ANO" --forcar
          python despesas/export.py

      # Guarda anti-truncamento: se o cache foi perdido, a base teria só o ano
      # corrente. Só comita se o total geral for coerente (>50 mi).
      - name: Commitar index (se houver e for íntegro)
        run: |
          TOTAL=$(python -c "import json;print(int(json.load(open('despesas-index.json',encoding='utf-8'))['totais']['geral']))")
          echo "index.json com total geral R$ $TOTAL."
          if [ "$TOTAL" -lt 50000000 ]; then
            echo "ABORTANDO commit: base parcial (total $TOTAL < 50mi), provável cache miss do .sqlite."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add despesas-index.json
          if git diff --quiet --cached; then
            echo "Sem mudancas na base."
          else
            git commit -m "chore: atualiza base de Despesas ($(date +%F))"
            git push
          fi
